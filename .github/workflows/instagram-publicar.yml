name: "Instagram · publicar carruseles programados"

# Cada 30 minutos mira si hay algún carrusel APROBADO (estado "programado") cuya hora ha llegado
# y lo publica en @aptorrescusa. Si no hay nada, termina en segundos sin instalar nada.
# Guía completa: instagram-studio/docs/08-automatizacion.md

on:
  schedule:
    - cron: "7,37 * * * *"   # minutos desplazados: a las en punto GitHub va saturado
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular (no publica nada en Instagram)"
        type: boolean
        default: true
      solo:
        description: "Solo este carrusel (slug). Igualmente tiene que estar aprobado y en hora."
        required: false
        default: ""

permissions:
  contents: write   # para guardar el estado de cada publicación en publicacion.json

concurrency:
  group: instagram-publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: instagram-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ¿Toca publicar algo?
        id: check
        run: node scripts/programacion.mjs toca

      - name: Instalar dependencias
        if: steps.check.outputs.toca == 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Publicar
        if: steps.check.outputs.toca == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN: ${{ vars.IG_LOGIN }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION }}
          IG_MEDIA_MODE: ${{ vars.IG_MEDIA_MODE }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          MEDIA_FTP_HOST: ${{ secrets.MEDIA_FTP_HOST }}
          MEDIA_FTP_USER: ${{ secrets.MEDIA_FTP_USER }}
          MEDIA_FTP_PASSWORD: ${{ secrets.MEDIA_FTP_PASSWORD }}
          MEDIA_FTP_DIR: ${{ vars.MEDIA_FTP_DIR }}
          MEDIA_FTP_SECURE: ${{ vars.MEDIA_FTP_SECURE }}
        run: |
          git config user.name "instagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publicar.mjs --commit ${{ inputs.simular == true && '--simular' || '' }} ${{ inputs.solo != '' && format('--solo {0}', inputs.solo) || '' }}
